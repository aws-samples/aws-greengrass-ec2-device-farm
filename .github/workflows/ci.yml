name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cdk:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Node.js 24
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: npm
    - name: Install dependencies
      run: |
        npm ci
        node --version
        npx cdk --version
    - name: Type Checking
      run: npm run build
    - name: Unit Tests
      run: npm test
    # Synth needs no AWS credentials. Device counts default to 1.
    - name: Synthesize (includes cdk-nag)
      run: npx cdk synth --quiet --no-notices
